<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" role="img" aria-labelledby="title description">
  <title id="title">ELVYN New Season Collection</title>
  <desc id="description">Editorial fashion illustration with a model wearing an elegant forest-green outfit, styled with a leather handbag.</desc>
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e2e9df"/>
      <stop offset=".56" stop-color="#f2e8dc"/>
      <stop offset="1" stop-color="#cfbba4"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
